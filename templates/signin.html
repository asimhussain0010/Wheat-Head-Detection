<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Wheat Head Detection</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
<script src="{{ url_for('static', filename='js/theme-switcher.js') }}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

<nav class="nav" style="position:relative">
  <div class="container nav-inner">
    <a href="{{ url_for('home') }}" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="">
      </span>
      <span class="brand-text">
        <b>Wheat<span class="brand-accent">Head</span></b>
        <small data-i18n="footer.tagline_short">Wheat head detection</small>
      </span>
    </a>
    <div class="nav-tools">
      <div class="dd">
        <button class="icon-btn" data-dropdown-toggle aria-label="Language" title="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
        </button>
        <div class="dropdown-menu dropdown-menu-lang">
          <span class="prefs-section-title" data-i18n="prefs.language">Language</span>
          <div class="prefs-lang-list">
            <button data-lang-btn="en">English <span>EN</span></button>
            <button data-lang-btn="ar">العربية <span>AR</span></button>
            <button data-lang-btn="fr">Français <span>FR</span></button>
            <button data-lang-btn="es">Español <span>ES</span></button>
            <button data-lang-btn="de">Deutsch <span>DE</span></button>
            <button data-lang-btn="pt">Português <span>PT</span></button>
            <button data-lang-btn="ru">Русский <span>RU</span></button>
            <button data-lang-btn="zh">中文 <span>ZH</span></button>
            <button data-lang-btn="hi">हिन्दी <span>HI</span></button>
            <button data-lang-btn="ur">اردو <span>UR</span></button>
            <button data-lang-btn="tr">Türkçe <span>TR</span></button>
            <button data-lang-btn="id">Indonesia <span>ID</span></button>
          </div>
        </div>
      </div>

      <div class="dd">
        <button class="icon-btn" data-dropdown-toggle aria-label="Theme" title="Theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.64a1.7 1.7 0 0 0 1.03-1.55V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.36 9a1.7 1.7 0 0 0 1.55 1.03H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="dropdown-menu dropdown-menu-prefs">
          <span class="prefs-section-title" data-i18n="prefs.theme">Theme</span>
          <div class="prefs-theme-row">
            <button data-theme-btn="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="prefs.light">Light</span></button>
            <button data-theme-btn="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg><span data-i18n="prefs.dark">Dark</span></button>
            <button data-theme-btn="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span data-i18n="prefs.system">System</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
      <h1 data-i18n="auth.signin_title">Welcome back</h1>
      <p data-i18n="auth.signin_sub">Sign in to access the detection dashboard</p>
    </div>

    <form class="form-detail" action="/signin" method="POST">
      {% if error %}<div class="form-alert form-alert-error">{{ error }}</div>{% endif %}
      {% if success %}<div class="form-alert form-alert-success">{{ success }}</div>{% endif %}
      <div class="field">
        <label for="full-name" data-i18n="auth.username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" name="user" id="full-name" class="input-text" data-i18n-placeholder="auth.username_ph" placeholder="Your username" required>
        </div>
      </div>
      <div class="field">
        <label for="password" data-i18n="auth.password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" name="password" id="password" class="input-text" data-i18n-placeholder="auth.password_ph" placeholder="Your password" required>
        </div>
      </div>
      <button type="submit" name="register" class="btn btn-primary btn-block" data-i18n="auth.signin_btn">Sign In</button>
    </form>

    <p class="auth-foot">
      <span data-i18n="auth.no_account">Don't have an account?</span>
      <a href="{{ url_for('logon') }}" data-i18n="auth.go_signup">Sign up</a>
    </p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/localization.js') }}"></script>
<script src="{{ url_for('static', filename='js/settings-menu.js') }}"></script>
</body>
</html>
