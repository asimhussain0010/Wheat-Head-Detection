<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up — Wheat Head Detection</title>
<script src="{{ url_for('static', filename='js/theme-switcher.js') }}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

<nav class="nav" style="position:relative">
  <div class="container nav-inner">
    <a href="{{ url_for('home') }}" class="brand">
      <span class="brand-mark">🌾</span>
      <span>Wheat Head <small data-i18n="footer.made">Detection</small></span>
    </a>
    <div class="nav-tools">
      <div class="theme-dd">
        <button class="theme-btn" data-theme-toggle>
          <svg data-theme-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span data-theme-label>System</span>
        </button>
        <div class="theme-menu">
          <button data-theme-btn="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
          <button data-theme-btn="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>Dark</button>
          <button data-theme-btn="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>System</button>
        </div>
      </div>

      <div class="lang-dd">
        <button class="lang-btn" data-lang-toggle>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
          <span data-lang-label>English</span>
        </button>
        <div class="lang-menu">
          <button data-lang-btn="en">English <span>EN</span></button>
          <button data-lang-btn="ar">العربية <span>AR</span></button>
          <button data-lang-btn="fr">Français <span>FR</span></button>
          <button data-lang-btn="es">Español <span>ES</span></button>
          <button data-lang-btn="de">Deutsch <span>DE</span></button>
          <button data-lang-btn="pt">Português <span>PT</span></button>
          <button data-lang-btn="ru">Русский <span>RU</span></button>
          <button data-lang-btn="zh">中文 <span>ZH</span></button>
          <button data-lang-btn="hi">हिन्दी <span>HI</span></button>
          <button data-lang-btn="ur">اردو <span>UR</span></button>
          <button data-lang-btn="tr">Türkçe <span>TR</span></button>
          <button data-lang-btn="id">Indonesia <span>ID</span></button>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:460px">
    <div class="auth-head">
      <span class="brand-mark" style="margin:0 auto">🌾</span>
      <h1 data-i18n="auth.signup_title">Create your account</h1>
      <p data-i18n="auth.signup_sub">Join to start detecting wheat heads</p>
    </div>

    <form class="form-detail" action="/signup" method="GET">
      <div class="field">
        <label for="username" data-i18n="auth.username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" name="user" id="username" class="input-text" data-i18n-placeholder="auth.username_ph" placeholder="Your username" required>
        </div>
      </div>
      <div class="field">
        <label for="full-name" data-i18n="auth.fullname">Full Name</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" name="name" id="full-name" class="input-text" data-i18n-placeholder="auth.fullname_ph" placeholder="Your full name" required>
        </div>
      </div>
      <div class="field">
        <label for="your-email" data-i18n="auth.email">Email</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input type="text" name="email" id="your-email" class="input-text" data-i18n-placeholder="auth.email_ph" placeholder="you@example.com" required pattern="[^@]+@[^@]+.[a-zA-Z]{2,6}">
        </div>
      </div>
      <div class="field">
        <label for="mobile" data-i18n="auth.mobile">Mobile Number</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
          <input type="text" name="mobile" id="mobile" class="input-text" data-i18n-placeholder="auth.mobile_ph" placeholder="Your phone number" required>
        </div>
      </div>
      <div class="field">
        <label for="password" data-i18n="auth.password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" name="password" id="password" class="input-text" data-i18n-placeholder="auth.password_ph" placeholder="Your password" required>
        </div>
      </div>
      <button type="submit" name="register" class="btn btn-primary btn-block" data-i18n="auth.signup_btn">Create Account</button>
    </form>

    <p class="auth-foot">
      <span data-i18n="auth.have_account">Already have an account?</span>
      <a href="{{ url_for('login') }}" data-i18n="auth.go_signin">Sign in</a>
    </p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/localization.js') }}"></script>
</body>
</html>
