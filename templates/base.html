<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Wheat Head Detection{% endblock %}</title>
<meta name="description" content="YOLOv5-based wheat head detection with separable convolutions.">

<!-- Theme applied before paint to avoid flash -->
<script src="{{ url_for('static', filename='js/theme-switcher.js') }}"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="{{ url_for('home') }}" class="brand">
      <span class="brand-mark">🌾</span>
      <span>
        Wheat Head <small data-i18n="footer.made">Detection</small>
      </span>
    </a>

    <button class="nav-burger" id="navBurger" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="{{ url_for('home') }}" data-i18n="nav.home" class="{{ 'active' if active=='home' else '' }}">Home</a></li>
      <li><a href="{{ url_for('index') }}" data-i18n="nav.upload" class="{{ 'active' if active=='upload' else '' }}">Detect</a></li>
      <li><a href="{{ url_for('about') }}" data-i18n="nav.about" class="{{ 'active' if active=='about' else '' }}">About</a></li>
      <li><a href="{{ url_for('notebook') }}" data-i18n="nav.notebook" class="{{ 'active' if active=='notebook' else '' }}">Notebook</a></li>
      <li><a href="{{ url_for('login') }}" data-i18n="nav.signout">Sign Out</a></li>
    </ul>

    <div class="nav-tools">
      <div class="theme-dd">
        <button class="theme-btn" data-theme-toggle>
          <svg data-theme-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span data-theme-label>System</span>
        </button>
        <div class="theme-menu">
          <button data-theme-btn="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
          <button data-theme-btn="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>Dark</button>
          <button data-theme-btn="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>System</button>
        </div>
      </div>

      <div class="lang-dd">
        <button class="lang-btn" data-lang-toggle>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
          <span data-lang-label>English</span>
        </button>
        <div class="lang-menu">
          <button data-lang-btn="en">English <span>EN</span></button>
          <button data-lang-btn="ar">العربية <span>AR</span></button>
          <button data-lang-btn="fr">Français <span>FR</span></button>
          <button data-lang-btn="es">Español <span>ES</span></button>
          <button data-lang-btn="de">Deutsch <span>DE</span></button>
          <button data-lang-btn="pt">Português <span>PT</span></button>
          <button data-lang-btn="ru">Русский <span>RU</span></button>
          <button data-lang-btn="zh">中文 <span>ZH</span></button>
          <button data-lang-btn="hi">हिन्दी <span>HI</span></button>
          <button data-lang-btn="ur">اردو <span>UR</span></button>
          <button data-lang-btn="tr">Türkçe <span>TR</span></button>
          <button data-lang-btn="id">Indonesia <span>ID</span></button>
        </div>
      </div>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer">
  <div class="container footer-inner">
    <span>© 2026 <span data-i18n="footer.made">Wheat Head Detection</span> · <span data-i18n="footer.rights">All rights reserved.</span></span>
    <ul class="footer-links">
      <li><a href="{{ url_for('home') }}" data-i18n="nav.home">Home</a></li>
      <li><a href="{{ url_for('about') }}" data-i18n="nav.about">About</a></li>
      <li><a href="{{ url_for('notebook') }}" data-i18n="nav.notebook">Notebook</a></li>
    </ul>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/localization.js') }}"></script>
<script>
  document.getElementById('navBurger') && document.getElementById('navBurger').addEventListener('click', function(){
    document.getElementById('navLinks').classList.toggle('open');
  });
  // scroll reveal
  document.addEventListener('DOMContentLoaded', function(){
    var els = document.querySelectorAll('[data-reveal]');
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {threshold:.12});
    els.forEach(function(el){ io.observe(el); });
  });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
